<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آیت الله بحبهانی</title><script src="/socket.io/socket.io.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#07090b;color:#eee;font-family:Tahoma,Arial,sans-serif}nav{height:68px;border-bottom:1px solid #25282c;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#090b0d;z-index:5}button,.btn{border:1px solid #555;background:#eee;color:#111;border-radius:9px;padding:10px 15px;cursor:pointer}.dark{background:#111;color:#eee}.gold{background:#b49a51}.hero{text-align:center;padding:100px 10px}.hero h1{font-size:clamp(32px,7vw,65px);margin:0}.hero p,.muted{color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#101317;border:1px solid #272b30;border-radius:15px;padding:20px}main{max-width:1100px;margin:auto;padding:25px}#admin,#room{display:none}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:20px;z-index:20}.box{background:#111418;border:1px solid #333;border-radius:16px;padding:24px;width:min(500px,100%)}input{width:100%;padding:12px;background:#080a0c;color:#eee;border:1px solid #34383d;border-radius:9px;margin:5px 0 12px}.chat{height:240px;overflow:auto;background:#090b0d;border:1px solid #282c30;border-radius:10px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:28px}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.video{background:#000;border-radius:12px;min-height:160px;display:flex;align-items:center;justify-content:center;color:#777}.msg{padding:5px;border-bottom:1px solid #181b1e}</style></head><body><nav><b>آیت الله بحبهانی</b><div class="row"><a class="btn" href="https://eitaa.com/bahbahani" target="_blank">کانال ایتا</a><button onclick="openM('register')">ثبت نام</button><button class="dark" onclick="openM('login')">ادمین</button></div></nav><main><section class="hero" id="home"><h1>آیت الله بحبهانی</h1><p>پلتفرم جلسات و پخش زنده</p><button class="gold" onclick="openM('register')">ورود به حساب</button></section><section id="admin"><h2>پنل مدیریت</h2><div class="grid"><div class="card">کاربران<div id="users" class="stat">0</div></div><div class="card">آنلاین<div id="online" class="stat">0</div></div><div class="card">جلسات<div id="roomsCount" class="stat">0</div></div></div><br><div class="card"><h3>ساخت جلسه</h3><input id="roomTitle" placeholder="عنوان جلسه"><label><input type="checkbox" id="privateRoom" style="width:auto"> جلسه خصوصی</label><input id="roomPass" placeholder="رمز جلسه"><button onclick="createRoom()">ساخت جلسه</button><p id="roomResult" class="muted"></p></div><br><div class="card"><h3>جلسات</h3><div id="roomList"></div></div></section><section id="room"><div class="row"><button onclick="leaveRoom()">خروج</button><button onclick="copyLink()">کپی لینک جلسه</button><button onclick="toggleMic()">میکروفون</button><button onclick="toggleCam()">دوربین</button></div><h2 id="roomTitleView"></h2><div id="viewerCount" class="muted"></div><div class="videos"><div class="video" id="localBox">دوربین شما</div></div><br><div class="card"><h3>چت زنده</h3><div id="chat" class="chat"></div><div class="row"><input id="chatInput" placeholder="پیام..." style="flex:1"><button onclick="sendChat()">ارسال</button></div></div></section></main><div class="modal" id="register"><div class="box"><button onclick="closeM()">×</button><h2>ثبت نام</h2><input id="first" placeholder="نام"><input id="last" placeholder="نام خانوادگی"><input id="email" type="email" placeholder="ایمیل"><input id="phone" placeholder="شماره تلفن"><input id="birth" type="date"><p class="muted">کد ملی و آدرس منزل در این نسخه ذخیره نمی‌شوند.</p><button onclick="register()">ثبت نام</button><p id="regMsg"></p></div></div><div class="modal" id="login"><div class="box"><button onclick="closeM()">×</button><h2>ورود ادمین</h2><input id="adminPass" type="password" placeholder="رمز پنل"><button onclick="login()">ورود</button><p id="loginMsg"></p></div></div><div class="modal" id="join"><div class="box"><h2>ورود به جلسه خصوصی</h2><input id="joinPass" placeholder="رمز جلسه"><button onclick="confirmJoin()">ورود</button></div></div><script>const socket=io();let me=JSON.parse(localStorage.getItem('bah_user')||'null'),currentRoom=null,stream=null;function openM(x){document.getElementById(x).style.display='flex'}function closeM(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}async function register(){let b={firstName:first.value,lastName:last.value,email:email.value,phone:phone.value,birthDate:birth.value},r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(j.id){me=j.user;localStorage.setItem('bah_user',JSON.stringify(me));regMsg.textContent='ثبت نام انجام شد.';setTimeout(closeM,700)}else regMsg.textContent=j.error||'خطا'}async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adminPass.value})});if(r.ok){closeM();home.style.display='none';admin.style.display='block';loadAdmin()}else loginMsg.textContent='1101: رمز اشتباه است.'}async function loadAdmin(){let s=await fetch('/api/admin/stats').then(r=>r.json());users.textContent=s.users;online.textContent=s.online;roomsCount.textContent=s.rooms;let rs=await fetch('/api/rooms').then(r=>r.json());roomList.innerHTML=rs.map(x=>`<div class="card"><b>${esc(x.title)}</b><br>بازدید فعلی: ${x.viewers}<br><button onclick="join('${x.id}',${x.privateRoom})">ورود</button></div>`).join('')||'جلسه‌ای ساخته نشده.'}async function createRoom(){let b={title:roomTitle.value,privateRoom:privateRoom.checked,password:roomPass.value},x=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());roomResult.textContent=location.origin+'/?room='+x.id;loadAdmin()}function join(id,priv){currentRoom=id;if(priv)openM('join');else startRoom('')}function confirmJoin(){closeM();startRoom(joinPass.value)}async function startRoom(pass){if(!me){openM('register');return}home.style.display='none';admin.style.display='none';room.style.display='block';socket.emit('identify',me);socket.emit('join-room',{roomId:currentRoom,password:pass,user:me});try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});localBox.textContent='دوربین و میکروفون فعال است'}catch(e){localBox.textContent='دسترسی دوربین/میکروفون داده نشد'}}socket.on('room-state',x=>{roomTitleView.textContent=x.room.title;viewerCount.textContent='حاضران: '+x.room.viewers});socket.on('room-error',x=>{alert(x);leaveRoom()});socket.on('kicked',x=>{alert(x);leaveRoom()});socket.on('chat',m=>{chat.innerHTML+=`<div class="msg"><b>${esc(m.user?.firstName||'کاربر')}</b>: ${esc(m.text)}</div>`;chat.scrollTop=chat.scrollHeight});function sendChat(){if(chatInput.value.trim())socket.emit('chat',{user:me,text:chatInput.value}),chatInput.value=''}function toggleMic(){stream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled)}function toggleCam(){stream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled)}function copyLink(){navigator.clipboard.writeText(location.origin+'/?room='+currentRoom);alert('لینک کپی شد')}function leaveRoom(){stream?.getTracks().forEach(t=>t.stop());room.style.display='none';home.style.display='block';currentRoom=null}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}const q=new URLSearchParams(location.search).get('room');if(q){currentRoom=q;setTimeout(()=>join(q,false),300)}</script></body></html>
